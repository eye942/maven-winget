name: validate winget
on: [pull_request, workflow_dispatch]
permissions: { contents: read }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !github.ref_protected }}
jobs:
  validate:
    runs-on: windows-2025
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - shell: pwsh
        run: |
          Get-ChildItem manifests/generated -Directory -ErrorAction SilentlyContinue | ForEach-Object { winget validate --manifest $_.FullName }
