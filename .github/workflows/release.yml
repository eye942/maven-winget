name: release
on:
  workflow_dispatch:
    inputs:
      maven_version: { required: true, type: string }
      prerelease: { required: false, type: boolean, default: false }
      source_url: { required: false, type: string }
  push:
    tags: ['v*']
permissions: { contents: write }
jobs:
  release:
    runs-on: windows-2025
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with: { dotnet-version: 8.0.x }
      - shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" eula accept wix7
      - shell: pwsh
        env: { VERSION: '${{ inputs.maven_version || github.ref_name }}', SOURCE_URL: '${{ inputs.source_url }}' }
        run: |
          $v=$env:VERSION -replace '^v',''; ./scripts/Build-Installer.ps1 -MavenVersion $v -SourceUrl $env:SOURCE_URL
          ./scripts/Generate-WingetManifest.ps1 -MavenVersion $v
          Get-FileHash artifacts/*.msi -Algorithm SHA256 | Format-List | Out-File artifacts/checksums.sha256
          Get-FileHash artifacts/*.msi -Algorithm SHA512 | Format-List | Out-File artifacts/checksums.sha512
          @{ SPDXID='SPDXRef-DOCUMENT'; name='maven-community-installer'; creationInfo=@{created=(Get-Date).ToUniversalTime().ToString('o')} } | ConvertTo-Json | Set-Content artifacts/sbom.spdx.json
      - uses: softprops/action-gh-release@6cbd405e2c4e67f4c6b5114b6ee0c5d5b8e14b79
        with: { prerelease: '${{ inputs.prerelease }}', files: 'artifacts/*,manifests/generated/**', body: 'Community-maintained MSI. Upstream archive verification and hashes are included in release-metadata.json.' }
