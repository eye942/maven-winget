name: submit published Maven release to WinGet
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published Maven release tag to resubmit after recovery
        required: true
        type: string
permissions: { contents: read }
concurrency:
  group: winget-submission-${{ github.event.release.id || inputs.release_tag }}
  cancel-in-progress: false
jobs:
  winget-submission:
    runs-on: windows-2025
    environment: release
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - name: Validate published release and derive candidate
        id: candidate
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          Import-Module ./scripts/MavenInstaller.Common.psm1 -Force
          $tag = $env:RELEASE_TAG
          if ($tag -match '^v(?<version>.+)$') {
            $channel = 'stable'
          } elseif ($tag -match '^maven3-preview-v(?<version>.+)$') {
            $channel = 'maven3-preview'
          } elseif ($tag -match '^maven4-preview-v(?<version>.+)$') {
            $channel = 'maven4-preview'
          } else {
            throw "Unsupported Maven release tag '$tag'."
          }
          $version = $Matches['version']
          Assert-MavenVersion $version
          Assert-ChannelVersion -Version $version -Channel $channel
          if ((Get-ReleaseTag $version $channel) -ne $tag) { throw "Release tag '$tag' does not match its Maven channel and version." }
          $release = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json' } -Uri "https://api.github.com/repos/$env:REPOSITORY/releases/tags/$tag"
          if ($release.draft) { throw "Release '$tag' is still a draft." }
          $assetName = "maven-community-$channel-$version-x64.msi"
          $asset = @($release.assets | Where-Object { $_.name -eq $assetName })
          if ($asset.Count -ne 1 -or $asset[0].size -lt 1) { throw "Published release '$tag' does not contain a non-empty '$assetName' asset." }
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with: { dotnet-version: 6.0.x }
      - name: Download and verify WingetCreate
        shell: pwsh
        run: |
          $url = 'https://github.com/microsoft/winget-create/releases/download/v1.12.8.0/wingetcreate.exe'
          $expectedHash = '8BD738851B524885410112678E3771B341C5C716DE60FBBECB88AB0A363ED85D'
          $path = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest -Uri $url -OutFile $path
          $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "WingetCreate SHA-256 mismatch. Expected $expectedHash; got $actualHash." }
          "path=$path" >> $env:GITHUB_OUTPUT
        id: wingetcreate
      - name: Update and submit WinGet manifest
        shell: pwsh
        env:
          MAVEN_CHANNEL: ${{ steps.candidate.outputs.channel }}
          MAVEN_VERSION: ${{ steps.candidate.outputs.version }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          ./scripts/Submit-WingetManifest.ps1 -MavenVersion $env:MAVEN_VERSION -Channel $env:MAVEN_CHANNEL -WingetCreatePath '${{ steps.wingetcreate.outputs.path }}'
