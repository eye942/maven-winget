name: submit published Maven release to WinGet
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published Maven release tag to resubmit after recovery
        required: true
        type: string
permissions: { contents: read }
concurrency:
  group: winget-submission-${{ github.event.release.id || inputs.release_tag }}
  cancel-in-progress: false
jobs:
  winget-submission:
    runs-on: windows-2025
    environment: release
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - name: Validate published release and derive candidate
        id: candidate
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          Import-Module ./scripts/MavenInstaller.Common.psm1 -Force
          $tag = $env:RELEASE_TAG
          if ($tag -match '^v(?<version>.+)$') {
            $channel = 'stable'
          } elseif ($tag -match '^maven3-preview-v(?<version>.+)$') {
            $channel = 'maven3-preview'
          } elseif ($tag -match '^maven4-preview-v(?<version>.+)$') {
            $channel = 'maven4-preview'
          } else {
            throw "Unsupported Maven release tag '$tag'."
          }
          $version = $Matches['version']
          Assert-MavenVersion $version
          Assert-ChannelVersion -Version $version -Channel $channel
          if ((Get-ReleaseTag $version $channel) -ne $tag) { throw "Release tag '$tag' does not match its Maven channel and version." }
          $release = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json' } -Uri "https://api.github.com/repos/$env:REPOSITORY/releases/tags/$tag"
          if ($release.draft) { throw "Release '$tag' is still a draft." }
          $assetName = "maven-community-$channel-$version-x64.msi"
          $asset = @($release.assets | Where-Object { $_.name -eq $assetName })
          if ($asset.Count -ne 1 -or $asset[0].size -lt 1) { throw "Published release '$tag' does not contain a non-empty '$assetName' asset." }
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "package_identifier=$(Get-PackageIdentifier $channel)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with: { dotnet-version: 6.0.x }
      - name: Download and validate published WinGet manifests
        id: manifest
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          PACKAGE_IDENTIFIER: ${{ steps.candidate.outputs.package_identifier }}
          MAVEN_VERSION: ${{ steps.candidate.outputs.version }}
          MAVEN_CHANNEL: ${{ steps.candidate.outputs.channel }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json' }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/releases/tags/$env:RELEASE_TAG"
          $manifestDirectory = Join-Path $env:RUNNER_TEMP 'winget-manifests'
          New-Item -ItemType Directory -Force -Path $manifestDirectory | Out-Null
          $names = @(
            "$env:PACKAGE_IDENTIFIER.yaml",
            "$env:PACKAGE_IDENTIFIER.locale.en-US.yaml",
            "$env:PACKAGE_IDENTIFIER.installer.yaml"
          )
          foreach ($name in $names) {
            $asset = @($release.assets | Where-Object { $_.name -eq $name })
            if ($asset.Count -ne 1 -or $asset[0].size -lt 1) { throw "Published release '$env:RELEASE_TAG' must contain exactly one non-empty '$name' asset." }
            Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/octet-stream' } -Uri $asset[0].url -OutFile (Join-Path $manifestDirectory $name)
          }
          $downloaded = @(Get-ChildItem -LiteralPath $manifestDirectory -Filter '*.yaml' -File)
          $actualNames = @($downloaded.Name | Sort-Object) -join '|'
          $expectedNames = @($names | Sort-Object) -join '|'
          if ($downloaded.Count -ne 3 -or $actualNames -ne $expectedNames) { throw 'Downloaded WinGet manifest asset names do not match the expected release assets.' }
          foreach ($file in $downloaded) {
            $yaml = Get-Content -LiteralPath $file.FullName -Raw
            if ($yaml -notmatch "(?m)^PackageIdentifier:\s*$([regex]::Escape($env:PACKAGE_IDENTIFIER))\s*$") { throw "$($file.Name) has an unexpected PackageIdentifier." }
            if ($yaml -notmatch "(?m)^PackageVersion:\s*$([regex]::Escape($env:MAVEN_VERSION))\s*$") { throw "$($file.Name) has an unexpected PackageVersion." }
          }
          $installer = Get-Content -LiteralPath (Join-Path $manifestDirectory "$env:PACKAGE_IDENTIFIER.installer.yaml") -Raw
          $msiUrl = "https://github.com/$env:REPOSITORY/releases/download/$env:RELEASE_TAG/maven-community-$env:MAVEN_CHANNEL-$env:MAVEN_VERSION-x64.msi"
          $urls = @([regex]::Matches($installer, '(?m)^\s*InstallerUrl:\s*(.+?)\s*$') | ForEach-Object { $_.Groups[1].Value })
          if ($urls.Count -ne 2 -or @($urls | Where-Object { $_ -ne $msiUrl }).Count -ne 0) { throw 'Installer manifest must contain two matching published MSI URLs.' }
          $architectures = @([regex]::Matches($installer, '(?m)^\s*-\s+Architecture:\s*(.+?)\s*$') | ForEach-Object { $_.Groups[1].Value })
          if ($architectures.Count -ne 2 -or @($architectures | Where-Object { $_ -ne 'x64' }).Count -ne 0) { throw 'Installer manifest must contain exactly two x64 installers.' }
          $scopes = @([regex]::Matches($installer, '(?m)^\s*Scope:\s*(.+?)\s*$') | ForEach-Object { $_.Groups[1].Value })
          $actualScopes = @($scopes | Sort-Object) -join '|'
          if ($scopes.Count -ne 2 -or $actualScopes -ne 'machine|user') { throw 'Installer manifest must contain user and machine scopes exactly once.' }
          winget validate --manifest $manifestDirectory
          if ($LASTEXITCODE -ne 0) { throw 'winget validate rejected the published manifest assets.' }
          "directory=$manifestDirectory" >> $env:GITHUB_OUTPUT
      - name: Download and verify WingetCreate
        shell: pwsh
        run: |
          $url = 'https://github.com/microsoft/winget-create/releases/download/v1.12.8.0/wingetcreate.exe'
          $expectedHash = '8BD738851B524885410112678E3771B341C5C716DE60FBBECB88AB0A363ED85D'
          $path = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest -Uri $url -OutFile $path
          $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "WingetCreate SHA-256 mismatch. Expected $expectedHash; got $actualHash." }
          "path=$path" >> $env:GITHUB_OUTPUT
        id: wingetcreate
      - name: Submit published WinGet manifest
        shell: pwsh
        env:
          MAVEN_VERSION: ${{ steps.candidate.outputs.version }}
          PACKAGE_IDENTIFIER: ${{ steps.candidate.outputs.package_identifier }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          ./scripts/Submit-WingetManifest.ps1 -ManifestDirectory '${{ steps.manifest.outputs.directory }}' -PackageIdentifier $env:PACKAGE_IDENTIFIER -Version $env:MAVEN_VERSION -WingetCreatePath '${{ steps.wingetcreate.outputs.path }}'
