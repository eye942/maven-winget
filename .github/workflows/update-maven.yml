name: discover Maven updates
on:
  schedule: [{ cron: '23 6 * * 1' }]
  workflow_dispatch:
permissions: { contents: read, pull-requests: write }
jobs:
  discover:
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, maven3-preview, maven4-preview]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Discover from Apache download page
        id: release
        shell: pwsh
        run: |
          $release = ./scripts/Get-MavenRelease.ps1 -Discover -Channel '${{ matrix.channel }}' | ConvertFrom-Json
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "source_url=$($release.SourceUrl)" >> $env:GITHUB_OUTPUT
          "publish_date=$($release.PublishDate)" >> $env:GITHUB_OUTPUT
      - name: Record the candidate
        shell: pwsh
        run: ./scripts/Update-Version.ps1 -MavenVersion '${{ steps.release.outputs.version }}' -Channel '${{ matrix.channel }}' -SourceUrl '${{ steps.release.outputs.source_url }}' -PublishDate '${{ steps.release.outputs.publish_date }}'
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN }}
          branch: automation/maven-${{ matrix.channel }}
          delete-branch: true
          title: 'chore(${{ matrix.channel }}): review Apache Maven ${{ steps.release.outputs.version }}'
          commit-message: 'chore(${{ matrix.channel }}): stage Maven ${{ steps.release.outputs.version }}'
          body: |
            ## Maven release candidate
            - Channel: `${{ matrix.channel }}`
            - Upstream version: `${{ steps.release.outputs.version }}`
            - Apache publish date: `${{ steps.release.outputs.publish_date }}`
            - Official ZIP: ${{ steps.release.outputs.source_url }}

            CI will independently download, verify the official SHA-512, build the MSI, and attach a release-preview bundle. Merge this PR to prepare a GitHub draft release; publication remains a maintainer action.
