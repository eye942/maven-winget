name: prepare Maven draft release
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      channel:
        description: Maven channel whose last discovered candidate should be prepared
        required: true
        type: choice
        options: [stable, maven3-preview, maven4-preview]
permissions: { contents: write }
jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.pull_request.head.ref == 'automation/maven-stable' ||
        github.event.pull_request.head.ref == 'automation/maven-maven3-preview' ||
        github.event.pull_request.head.ref == 'automation/maven-maven4-preview'))
    runs-on: windows-2025
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Read merged channel candidate
        id: candidate
        shell: pwsh
        env:
          MANUAL_CHANNEL: ${{ inputs.channel }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $channel=$env:MANUAL_CHANNEL
          } else {
            $branch=$env:PR_HEAD_REF
            $channel = if ($branch -eq 'automation/maven-maven3-preview') {'maven3-preview'} elseif ($branch -eq 'automation/maven-maven4-preview') {'maven4-preview'} else {'stable'}
          }
          $state=Get-Content -Raw config/ReleaseState.json | ConvertFrom-Json
          $candidate=$state.channels.$channel.lastDiscovered
          if ($null -eq $candidate -or [string]::IsNullOrWhiteSpace($candidate.version)) { throw "No merged candidate exists for $channel." }
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "version=$($candidate.version)" >> $env:GITHUB_OUTPUT
          "source_url=$($candidate.sourceUrl)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with: { dotnet-version: 8.0.x }
      - shell: pwsh
        env:
          MAVEN_CHANNEL: ${{ steps.candidate.outputs.channel }}
          MAVEN_SOURCE_URL: ${{ steps.candidate.outputs.source_url }}
          MAVEN_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          dotnet tool install --global wix --version 7.0.0
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" eula accept wix7
          ./scripts/Build-Installer.ps1 -MavenVersion $env:MAVEN_VERSION -Channel $env:MAVEN_CHANNEL -SourceUrl $env:MAVEN_SOURCE_URL
          ./scripts/Generate-WingetManifest.ps1 -MavenVersion $env:MAVEN_VERSION -Channel $env:MAVEN_CHANNEL
          ./scripts/Submit-WingetManifest.ps1 -MavenVersion $env:MAVEN_VERSION -Channel $env:MAVEN_CHANNEL -DryRun | Format-List | Out-String | Write-Host
          Get-FileHash artifacts/*.msi -Algorithm SHA256 | Format-List | Out-File artifacts/checksums.sha256
          Get-FileHash artifacts/*.msi -Algorithm SHA512 | Format-List | Out-File artifacts/checksums.sha512
          @{ SPDXID='SPDXRef-DOCUMENT'; name='maven-community-installer'; creationInfo=@{created=(Get-Date).ToUniversalTime().ToString('o')} } | ConvertTo-Json | Set-Content artifacts/sbom.spdx.json
          Import-Module ./scripts/MavenInstaller.Common.psm1 -Force
          $tag = Get-ReleaseTag $env:MAVEN_VERSION $env:MAVEN_CHANNEL
          "tag=$tag" >> $env:GITHUB_OUTPUT
        id: build
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          prerelease: ${{ steps.candidate.outputs.channel != 'stable' }}
          draft: true
          files: |
            artifacts/*
            manifests/generated/**/*.yaml
          body: 'Draft release prepared from a verified Apache archive. Review artifacts, then run the publish verified Maven release workflow.'
